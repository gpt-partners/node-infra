---
# Entry point. The ansible-pull timer on the node runs this playbook from main.
- name: Configure the node
  hosts: localhost
  become: true

  roles:
    - ansible_pull
    - base
    - docker
    # wg-easy creates the bridge that dnsmasq listens on.
    - wg_easy
    - dnsmasq
    - k3s
    - vpn_ui
    - argocd_bootstrap
