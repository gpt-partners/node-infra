---
- name: Require the Argo CD values from the environment
  ansible.builtin.assert:
    that:
      - node_argocd_repo_url | length > 0
      - node_argocd_deploy_key_file | length > 0
    fail_msg: "Set NODE_INFRA_ARGOCD_REPO_URL and NODE_INFRA_ARGOCD_DEPLOY_KEY_FILE in /etc/node-infra/pull.env, see pull.env.example."
    quiet: true

- name: Check the deploy key file
  ansible.builtin.stat:
    path: "{{ node_argocd_deploy_key_file }}"
  register: argocd_bootstrap_key

- name: Require the deploy key file
  ansible.builtin.assert:
    that: argocd_bootstrap_key.stat.exists
    fail_msg: "{{ node_argocd_deploy_key_file }} is missing. Create the read-only deploy key as described in README.md."
    quiet: true

# Argo CD manages itself from the platform repository (platform/argocd.yaml). The server installs
# it only when it is missing, e.g. on a new node, and then hands it over: the k3s HelmChart is
# released without uninstalling the chart.
- name: Check whether Argo CD is installed
  ansible.builtin.command:
    cmd: k3s kubectl -n argocd get deployment argocd-server
  register: argocd_bootstrap_installed
  changed_when: false
  failed_when: false

- name: Install Argo CD (first run only)
  ansible.builtin.template:
    src: argocd.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/node-infra-argocd.yaml
    owner: root
    group: root
    mode: "0600"
  when: argocd_bootstrap_installed.rc != 0

- name: Wait until Argo CD is ready
  ansible.builtin.command:
    cmd: k3s kubectl -n argocd rollout status {{ item }} --timeout=10s
  register: argocd_bootstrap_ready
  until: argocd_bootstrap_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  loop:
    - deployment/argocd-repo-server
    - deployment/argocd-server
    - statefulset/argocd-application-controller
  when: not ansible_check_mode

# Remove the file first: k3s would recreate the HelmChart from it on its next start.
- name: Remove the Argo CD chart file from the k3s manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/node-infra-argocd.yaml
    state: absent

- name: Check for the k3s HelmChart of Argo CD
  ansible.builtin.command:
    cmd: k3s kubectl -n kube-system get helmchart argocd
  register: argocd_bootstrap_helmchart
  changed_when: false
  failed_when: false

# unmanaged: the helm-controller ignores the chart; without the finalizer, deleting it does not
# run helm uninstall. The Helm release secrets are only needed by helm, not by Argo CD.
- name: Hand Argo CD over to itself
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n kube-system annotate --overwrite helmchart argocd helmcharts.helm.cattle.io/unmanaged=true
      && k3s kubectl -n kube-system patch helmchart argocd --type=merge -p '{"metadata":{"finalizers":null}}'
      && k3s kubectl -n kube-system delete helmchart argocd
      && k3s kubectl -n argocd delete secret -l owner=helm,name=argocd
    executable: /bin/bash
  when: argocd_bootstrap_helmchart.rc == 0 and not ansible_check_mode
  changed_when: true

# The private key goes from the file straight into the cluster; it is never written elsewhere.
- name: Store the repository credentials in the cluster
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n argocd create secret generic repo-platform
      --from-literal=type=git
      --from-literal=url={{ node_argocd_repo_url | quote }}
      --from-file=sshPrivateKey={{ node_argocd_deploy_key_file | quote }}
      --dry-run=client -o yaml
      | k3s kubectl label --local -f - argocd.argoproj.io/secret-type=repository -o yaml
      | k3s kubectl apply -f -
    executable: /bin/bash
  register: argocd_bootstrap_repo
  changed_when: argocd_bootstrap_repo.stdout is search('created|configured')
  when: not ansible_check_mode

- name: Check the GitHub App key file
  ansible.builtin.stat:
    path: "{{ node_argocd_github_app_key_file }}"
  register: argocd_bootstrap_app_key
  when: node_argocd_github_app_key_file | length > 0

- name: Require all GitHub App values together
  ansible.builtin.assert:
    that:
      - node_argocd_github_app_id | length > 0
      - node_argocd_github_app_installation_id | length > 0
      - argocd_bootstrap_app_key.stat.exists | default(false)
    fail_msg: >-
      Set NODE_INFRA_ARGOCD_GITHUB_APP_ID, NODE_INFRA_ARGOCD_GITHUB_APP_INSTALLATION_ID and
      NODE_INFRA_ARGOCD_GITHUB_APP_KEY_FILE together (the key file must exist), or none of them.
    quiet: true
  when: node_argocd_github_app_id | length > 0 or node_argocd_github_app_installation_id | length > 0
    or node_argocd_github_app_key_file | length > 0

# Credential template: Argo CD uses it for every repository below this URL. The private key goes
# from the file straight into the cluster.
- name: Store the GitHub App credentials in the cluster
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      k3s kubectl -n argocd create secret generic repo-creds-github
      --from-literal=type=git
      --from-literal=url={{ argocd_bootstrap_github_url | quote }}
      --from-literal=githubAppID={{ node_argocd_github_app_id | quote }}
      --from-literal=githubAppInstallationID={{ node_argocd_github_app_installation_id | quote }}
      --from-file=githubAppPrivateKey={{ node_argocd_github_app_key_file | quote }}
      --dry-run=client -o yaml
      | k3s kubectl label --local -f - argocd.argoproj.io/secret-type=repo-creds -o yaml
      | k3s kubectl apply -f -
    executable: /bin/bash
  register: argocd_bootstrap_app_creds
  changed_when: argocd_bootstrap_app_creds.stdout is search('created|configured')
  when: node_argocd_github_app_id | length > 0 and not ansible_check_mode

- name: Create the directory for applied manifests
  ansible.builtin.file:
    path: /etc/node-infra/k8s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render the root application
  ansible.builtin.template:
    src: root-app.yaml.j2
    dest: /etc/node-infra/k8s/argocd-root-app.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply the root application
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/node-infra/k8s/argocd-root-app.yaml
  register: argocd_bootstrap_root
  changed_when: argocd_bootstrap_root.stdout is search('created|configured')
  when: not ansible_check_mode
