---
# Docker from the Ubuntu archive, with the compose plugin (`docker compose`) that wg-easy needs.
- name: Install Docker and the compose plugin
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    cache_valid_time: 86400
    # unattended-upgrades can hold the dpkg lock for a while.
    lock_timeout: 600

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
