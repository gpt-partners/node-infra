---
- name: Require the VPN UI values from the environment
  ansible.builtin.assert:
    that:
      - node_vpn_bridge_ipv4 | length > 0
      - node_vpn_ui_host | length > 0
      - node_acme_email | length > 0
    fail_msg: "Set NODE_INFRA_VPN_UI_HOST and NODE_INFRA_ACME_EMAIL in /etc/node-infra/pull.env, see pull.env.example."
    quiet: true

# k3s applies files in its manifests directory by itself (HelmChart and HelmChartConfig are built in).
- name: Install the Traefik config and the cert-manager chart
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/var/lib/rancher/k3s/server/manifests/node-infra-{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - traefik-config.yaml
    - cert-manager.yaml

- name: Wait until cert-manager is ready
  ansible.builtin.command:
    cmd: k3s kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=10s
  register: vpn_ui_cert_manager
  until: vpn_ui_cert_manager.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  when: not ansible_check_mode

- name: Create the directory for applied manifests
  ansible.builtin.file:
    path: /etc/node-infra/k8s
    state: directory
    owner: root
    group: root
    mode: "0700"

# Contains the ACME e-mail address, so it stays on the node.
- name: Render the VPN UI manifests
  ansible.builtin.template:
    src: vpn-ui.yaml.j2
    dest: /etc/node-infra/k8s/vpn-ui.yaml
    owner: root
    group: root
    mode: "0600"

- name: Apply the VPN UI manifests
  ansible.builtin.command:
    cmd: k3s kubectl apply -f /etc/node-infra/k8s/vpn-ui.yaml
  register: vpn_ui_apply
  changed_when: vpn_ui_apply.stdout is search('created|configured')
  when: not ansible_check_mode

- name: Wait until the certificate is issued
  ansible.builtin.command:
    cmd: k3s kubectl -n wg-easy wait certificate/wg-easy-tls --for=condition=Ready --timeout=10s
  register: vpn_ui_certificate
  until: vpn_ui_certificate.rc == 0
  retries: 18
  delay: 10
  changed_when: false
  when: not ansible_check_mode
