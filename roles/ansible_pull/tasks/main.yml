---
- name: Install ansible-core and git
  ansible.builtin.apt:
    name: [ansible-core, git]
    state: present
    cache_valid_time: 86400
    # unattended-upgrades can hold the dpkg lock for a while.
    lock_timeout: 600

- name: Check the env file
  ansible.builtin.stat:
    path: "{{ ansible_pull_env_file }}"
  register: ansible_pull_env

- name: Require the env file
  ansible.builtin.assert:
    that: ansible_pull_env.stat.exists
    fail_msg: "{{ ansible_pull_env_file }} is missing. Create it by hand as described in README.md."
    quiet: true

# node-exporter (kube-prometheus-stack in the platform repo) reads *.prom files from here.
- name: Create the textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the textfile helper
  ansible.builtin.copy:
    src: node-infra-textfile
    dest: /usr/local/sbin/node-infra-textfile
    owner: root
    group: root
    mode: "0755"

- name: Install the result hook of the ansible-pull service
  ansible.builtin.template:
    src: node-infra-pull-result.j2
    dest: /usr/local/sbin/node-infra-pull-result
    owner: root
    group: root
    mode: "0755"

- name: Install the ansible-pull service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - node-infra-pull.service
    - node-infra-pull.timer
  notify: Restart the ansible-pull timer

- name: Enable and start the ansible-pull timer
  ansible.builtin.systemd_service:
    name: node-infra-pull.timer
    enabled: true
    state: started
    daemon_reload: true
